dataset:
  name: V2V4Real
  path: data/preprocess/preprocessed/V2V4Real
  split: test
  fps: 10
ego_vehicle: vehicle_2
vehicles:
  vehicle_1:
    type: broadcasting
    parameters:
      tracking_buffer_s: 2.0
      observed_past_s: 1.0
      prediction_horizon_s: 2.0
      device: cuda:1
    detector:
      name: centerpoint
      detections: /media/nadya/86bf701c-9a26-47cf-89c1-3a952cb40cc1/coltp_datasets/V2V4Real/detections/test/0
      reflect_lidar_y: false
      max_distance_m: 50.0
    tracker:
      name: metric_association
    predictor:
      layout: track
      checkpoint: checkpoints/V2V4Real/10_20/lstm_bivariate_relative/best.pth
      calibration_certificate: outputs/calibration/V2V4Real/lstm/10_20/motion_covariance/certificate.json
    sensors:
    - lidar01
    broadcaster:
      broadcasting_interval_s: 0.1
      topic: pred
  vehicle_2:
    type: aggregating
    parameters:
      tracking_buffer_s: 2.0
      observed_past_s: 1.0
      prediction_horizon_s: 2.0
      device: cuda:1
    detector:
      name: centerpoint
      detections: /media/nadya/86bf701c-9a26-47cf-89c1-3a952cb40cc1/coltp_datasets/V2V4Real/detections/test/1
      reflect_lidar_y: false
      max_distance_m: 50.0
    tracker:
      name: metric_association
    predictor:
      layout: track
      checkpoint: checkpoints/V2V4Real/10_20/lstm_bivariate_relative/best.pth
      calibration_certificate: outputs/calibration/V2V4Real/lstm/10_20/motion_covariance/certificate.json
    listener:
      topic: pred
      drop: false
    category_l:
      alignment:
        align: true
        min_points: 10
      fusion:
        type: linear_fusion
        max_mean_cov_trace_m2: 5.0
    category_s:
      enabled: true
      alignment:
        align: true
        min_points: 10
      fusion:
        type: gp_vector
        workers: 1
    sensors:
    - lidar01
