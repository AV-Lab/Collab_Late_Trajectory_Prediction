# Runnable OPV2V template: two LSTM predictors, vehicle_1 aggregating.
# Run from the COLTP root; paths below are relative to that directory.
# Keep vehicles ordered vehicle_1, vehicle_2: order selects dataset vehicles.
# To make vehicle_2 ego, swap role blocks and change ego_vehicle; keep key order.
# Ready-made variants are in vehicle_1/ and vehicle_2/, for test and valid.
dataset:
  name: OPV2V
  path: preprocess/preprocessed/OPV2V
  split: test  # test or valid for evaluation
  fps: 10

ego_vehicle: vehicle_1
vehicles:
  vehicle_1:
    type: aggregating
    parameters:
      tracking_buffer_s: 2.0
      observed_past_s: 1.0
      prediction_horizon_s: 2.0
      device: cuda:0  # Predictors use CUDA; fusion uses CPU.
    detector:
      name: gt_occ
    tracker:
      name: metric_association
    predictor:
      layout: track
      checkpoint: ../TrajZoo/trajzoo-code/checkpoints/opv2v/bivariate/lstm_bivariate_relative_k1_opv2v/best.pth
      # Required for fusion participants; must match checkpoint and inference settings.
      calibration_certificate: outputs/calibration/lstm_bootstrap_certificate.json
    listener:
      topic: pred
      drop: false
    category_l:  # Locally observed objects with associated sharing predictions.
      alignment:
        align: true  # Rebase and trim, then interpolate onto ego timestamps.
        min_points: 10
      gate:
        type: none  # Alternative: kf.
        # Optional defaults: mode: simple, min_streak: 2,
        # cov_ratio_thr: 2.0, nis_thr: 5.99.
      fusion:
        type: linear_fusion  # Alternatives: gp or gp_vector (residual fusion).
        # One scalar weight per source over each interval with unchanged availability.
        # Inverse certified risk determines weights; the interval gate is always enabled.
        # Certificate bounds use the nearest original forecast horizon (earlier on ties).
        # Interpolated sharing means/covariances are retained; lookup does not extrapolate.
    category_s:  # Objects observed only through sharing.
      alignment:
        align: true  # Rebase and trim, then interpolate onto ego timestamps.
        min_points: 10
      gate:
        type: none  # Alternative: consensus.
        # Optional defaults: threshold: 2.0, min_predictions: 3, min_overlap: 0.5.
      fusion:
        type: gp_vector  # Alternatives: gp. Linear fusion is not supported here.
        workers: 1  # Only valid for gp_vector; --fusion-workers overrides this.
    sensors:
      - lidar01

  vehicle_2:
    type: broadcasting
    parameters:
      tracking_buffer_s: 2.0
      observed_past_s: 1.0
      prediction_horizon_s: 2.0
      device: cuda:0
    detector:
      name: gt_occ
    tracker:
      name: metric_association
    predictor:
      layout: track
      checkpoint: ../TrajZoo/trajzoo-code/checkpoints/opv2v/bivariate/lstm_bivariate_relative_k1_opv2v/best.pth
      calibration_certificate: outputs/calibration/lstm_bootstrap_certificate.json
    sensors:
      - lidar01
    broadcaster:
      broadcasting_interval_s: 0.1
      topic: pred

# Certificates supply scalar risks for weights and interval-gate bounds.
# GT calibration is a separate --gt-calibration experiment, supported only
# when both fusion categories use gp_vector. It is off in this template.
