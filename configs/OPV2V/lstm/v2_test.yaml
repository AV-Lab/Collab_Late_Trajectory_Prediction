# OPV2V test: vehicle_2 is ego; both predictors use LSTM 10/20.
# Vehicle order fixes dataset assignment: vehicle_1, then vehicle_2.
# Category L: scalar interval fusion with transmitted bounds; Category S: vector GP.
# Alignment interpolates positions and selects the nearest native covariance/bounds.
# Both vehicles use motion certificates; replace motion_bootstrap with bootstrap
# in both certificate paths to compare the original estimator.
dataset:
  name: OPV2V
  path: preprocess/preprocessed/OPV2V
  split: test
  fps: 10
ego_vehicle: vehicle_2
vehicles:
  vehicle_1:
    type: broadcasting
    parameters:
      tracking_buffer_s: 2.0
      observed_past_s: 1.0
      prediction_horizon_s: 2.0
      device: cuda:0
    detector:
      name: gt_occ
    tracker:
      name: metric_association
    predictor:
      layout: track
      checkpoint: checkpoints/OPV2V/10_20/lstm_bivariate_relative/best.pth
      calibration_certificate: outputs/calibration/OPV2V/lstm/10_20/motion_bootstrap/certificate.json
    sensors:
    - lidar01
    broadcaster:
      broadcasting_interval_s: 0.1
      topic: pred
  vehicle_2:
    type: aggregating
    parameters:
      tracking_buffer_s: 2.0
      observed_past_s: 1.0
      prediction_horizon_s: 2.0
      device: cuda:0
    detector:
      name: gt_occ
    tracker:
      name: metric_association
    predictor:
      layout: track
      checkpoint: checkpoints/OPV2V/10_20/lstm_bivariate_relative/best.pth
      calibration_certificate: outputs/calibration/OPV2V/lstm/10_20/motion_bootstrap/certificate.json
    listener:
      topic: pred
      drop: false
    category_l:
      alignment:
        align: true
        min_points: 10
      gate:
        type: none
      fusion:
        type: linear_fusion
    category_s:
      alignment:
        align: true
        min_points: 10
      gate:
        type: none
      fusion:
        type: gp_vector
        workers: 1
    sensors:
    - lidar01
