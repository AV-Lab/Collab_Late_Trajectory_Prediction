# Ego-only OPV2V valid: real detections, metric_association, and LSTM 10/20.
# Same checkpoint and rates as v1_valid.yaml; vehicle_1 uses dataset slot 0.
dataset:
  name: OPV2V
  path: preprocess/preprocessed/OPV2V
  split: valid
  fps: 10
ego_vehicle: vehicle_1
vehicles:
  vehicle_1:
    type: basic
    parameters:
      tracking_buffer_s: 2.0
      observed_past_s: 1.0
      prediction_horizon_s: 2.0
      device: cpu
    detector:
      name: centerpoint
      detections: /media/nadya/86bf701c-9a26-47cf-89c1-3a952cb40cc1/coltp_datasets/OPV2V/detections/valid/0
      reflect_lidar_y: true
      max_distance_m: 50.0  # Same ego-centred range as the preprocessed GT labels.
    tracker:
      name: metric_association
    predictor:
      layout: track
      checkpoint: checkpoints/OPV2V/10_20/lstm_bivariate_relative/best.pth
    sensors:
    - lidar01
