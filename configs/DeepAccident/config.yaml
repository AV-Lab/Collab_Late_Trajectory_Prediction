dataset:
  name: "DeepAccident"
  path: "preprocess/preprocessed/DeepAccident"
  split: "valid" # ["train", "valid", "test"]
  fps: 10

ego_vehicle: "vehicle_4"

vehicles:
  vehicle_1:
    type: "broadcasting"
    parameters:
      tracking_buffer_s: 2.0
      observed_past_s: 1.0
      prediction_horizon_s: 2.0
      device: "cuda:0"

    detector:
      name: "gt_occ"    # [gt, gt_occ, centerpoint]
      #detections: "data/detections/DeepAccident/noisy_observations_kf/val/other_vehicle"

    tracker:
      name: "id_association"

    predictor:
      name: "lstm_nll"
      checkpoint: "train_predictor/checkpoints/DeepAccident_lstm_nll_10_20_10.pth"

    broadcaster:
      broadcasting_interval_s: 0.1
      topic: "pred"
    
    listener:
      topic: "pred"

    sensors:
      - "lidar01"

  vehicle_2:
    type: "broadcasting"  # [basic, aggregating, broadcasting, hybrid]
    parameters:
      tracking_buffer_s: 2.0
      observed_past_s: 1.0
      prediction_horizon_s: 2.0
      device: "cuda:0" #options [cuda, cpu, cuda:1]
    
    detector:
      name: "gt_occ"    # [gt, centerpoint] 
      #detections: "data/detections/DeepAccident/noisy_observations/val/ego_vehicle"
    
    tracker:
      name: "id_association" #[id_association, metric_association]
      # No mode or checkpoint needed, as it's algorithmic
    
    predictor:
      name: "lstm_nll"   # [lstm, lstm_cat, transformer, transformer_cat]
      checkpoint: "train_predictor/checkpoints/DeepAccident_lstm_nll_10_20_10.pth"
    
    broadcaster:
      broadcasting_interval_s: 0.1
      topic: "pred"
      
    listener:
      topic: "pred"

    sensors:
      - "lidar01"
      
      
  vehicle_3:
    type: "broadcasting"
    parameters:
      tracking_buffer_s: 2.0
      observed_past_s: 1.0
      prediction_horizon_s: 2.0
      device: "cuda:0"
    
    detector:
      name: "gt_occ"   
     
    tracker:
      name: "id_association"
    
    predictor:
      name: "lstm_nll"
      checkpoint: "train_predictor/checkpoints/DeepAccident_lstm_nll_10_20_10.pth" 
      # "fps", "prediction_horizon", "prediction_sampling" are fetched form the predictor
    
    broadcaster:
      broadcasting_interval_s: 0.1
      topic: "pred"
      
    listener:
      topic: "pred"

    sensors:
      - "lidar01"
      
  vehicle_4:
    type: "aggregating"
    parameters:
      tracking_buffer_s: 2.0
      observed_past_s: 1.0
      prediction_horizon_s: 2.0
      device: "cuda:0"
    
    detector:
      name: "gt_occ"   
     
    tracker:
      name: "id_association"
    
    predictor:
      name: "lstm_nll"
      checkpoint: "train_predictor/checkpoints/DeepAccident_lstm_nll_10_20_10.pth" 
      # "fps", "prediction_horizon", "prediction_sampling" are fetched form the predictor
    
    broadcaster:
      broadcasting_interval_s: 0.1
      topic: "pred"
      
    listener:
      topic: "pred"

    fusion:
      type: "gp" # [gp, gp_vector]
    
    sensors:
      - "lidar01"
